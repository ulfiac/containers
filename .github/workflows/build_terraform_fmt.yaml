name: build terraform-fmt

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_terraform_fmt.yaml
      - terraform-fmt/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_terraform_fmt.yaml
      - terraform-fmt/**

permissions:
  contents: read

jobs:
  build-image:
    name: ${{ github.event_name == 'pull_request' && 'build image as a PR check' || 'build image and push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # checkout
      packages: write     # push image to GHCR
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: read terraform version
        id: version
        run: echo "value=$(cat terraform-fmt/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: build and load image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            TERRAFORM_VERSION=${{ steps.version.outputs.value }}
          context: terraform-fmt
          load: true
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/ulfiac/terraform-fmt:${{ steps.version.outputs.value }}

      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '0'
          image-ref: 'ghcr.io/ulfiac/terraform-fmt:${{ steps.version.outputs.value }}'

      # pull request checks stop here; push to main keeps going

      - name: login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            TERRAFORM_VERSION=${{ steps.version.outputs.value }}
          context: terraform-fmt
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ulfiac/terraform-fmt:${{ steps.version.outputs.value }}
