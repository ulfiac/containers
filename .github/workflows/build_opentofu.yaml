name: build opentofu

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_opentofu.yaml
      - opentofu/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build_opentofu.yaml
      - opentofu/**

permissions:
  contents: read

jobs:
  build-image:
    name: ${{ github.event_name == 'pull_request' && 'build image as a PR check' || 'build image and push' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read      # checkout
      packages: write     # push image to GHCR
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: read opentofu version
        id: version
        run: echo "value=$(cat opentofu/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            OPENTOFU_VERSION=${{ steps.version.outputs.value }}
          context: opentofu
          load: true
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/ulfiac/opentofu:${{ steps.version.outputs.value }}

      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '0'
          image-ref: 'ghcr.io/ulfiac/opentofu:${{ steps.version.outputs.value }}'

      # pull request checks stop here; push to main keeps going

      - name: login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            OPENTOFU_VERSION=${{ steps.version.outputs.value }}
          context: opentofu
          platforms: linux/amd64
          provenance: false
          push: true
          sbom: false
          tags: |
            ghcr.io/ulfiac/opentofu:${{ steps.version.outputs.value }}

      - name: get github app token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.ACTIONS_BOT_APP_CLIENT_ID }}
          owner: ulfiac
          permission-actions: write
          private-key: ${{ secrets.ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: commons

      - name: trigger renovate workflow
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run "_renovate.yaml" \
            --repo ulfiac/commons \
            --ref main \
            -f dry-run=none \
            -f log-level=info
