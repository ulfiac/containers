name: reusable-trigger-renovate

on:
  workflow_call:
    secrets:
      ACTIONS_BOT_APP_CLIENT_ID:
        required: true
      ACTIONS_BOT_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: trigger-renovate
  cancel-in-progress: false

permissions: {}

jobs:
  trigger-renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: sleep for 5 minutes
        run: sleep 300

      - name: get github app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.ACTIONS_BOT_APP_CLIENT_ID }}
          owner: ulfiac
          permission-actions: write
          private-key: ${{ secrets.ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: commons

      - name: trigger renovate workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run "_renovate.yaml" \
            --repo ulfiac/commons \
            --ref main \
            -f dry-run=none \
            -f log-level=info
